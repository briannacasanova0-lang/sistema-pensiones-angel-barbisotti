services:
  db:
    image: postgres:18
    container_name: pensiones-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pensiones_postgres_data:/var/lib/postgresql/data

volumes:
  pensiones_postgres_data: